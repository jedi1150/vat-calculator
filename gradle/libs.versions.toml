kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
ktlint-cli = { group = "io.github.ktlint.core", name = "ktlint-cli", version.ref = "ktlint" }
#moneytostr = { module = "com.github.javadev:moneytostr", version.ref = "moneytostr" }
