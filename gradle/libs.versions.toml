firebaseCrashlyticsPlugin = "3.0.8"
gmsPlugin = "4.5.0"
hilt = "2.60.1"
kotlin = "2.4.20"
kotlinxSerialization = "1.11.0"
ksp = "2.3.11"
junit = "6.0.3"
ktlint = "2.0.0-ALPHA-4"
#moneytostr = "1.21"
nav3Core = "1.1.7"
navigationevent = "1.1.2"
