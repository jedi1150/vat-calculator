[versions]
androidGradlePlugin = "9.4.0"
androidxActivity = "1.13.0"
androidxAppCompat = "1.8.0"
androidxBrowser = "1.10.0"
androidxComposeBom = "2026.08.00"
androidxCore = "1.19.0"
androidxCoreSplashscreen = "1.2.0"
androidxDataStore = "1.2.1"
androidxHiltNavigationCompose = "1.4.0"
androidxLifecycle = "2.11.0"
detekt = "2.0.0-alpha.6"
